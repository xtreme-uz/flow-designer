spring:
  application:
    name: flow-designer

server:
  port: 8080
  forward-headers-strategy: native

app:
  oauth2:
    # Which Git host people sign in through: gitlab or github. Pick the one that
    # hosts app.git.remote-url — a login on one host cannot authorise a push to
    # another. Only the selected provider is registered; the application refuses
    # to start when its client id and secret are missing.
    provider: ${AUTH_PROVIDER:gitlab}
    gitlab:
      client-id: ${GITLAB_CLIENT_ID:}
      client-secret: ${GITLAB_CLIENT_SECRET:}
      # A self-hosted instance, e.g. https://gitlab.example.com
      base-url: ${GITLAB_BASE_URL:}
      api-url: ${GITLAB_API_URL:}
      redirect-uri: ${GITLAB_REDIRECT_URL:}
      # write_repository is what pushing as the signed-in user needs
      scope: ${GITLAB_SCOPE:read_user}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      # A GitHub Enterprise Server instance, e.g. https://github.example.com
      base-url: ${GITHUB_BASE_URL:}
      api-url: ${GITHUB_API_URL:}
      redirect-uri: ${GITHUB_REDIRECT_URL:}
      # repo is what pushing as the signed-in user needs
      scope: ${GITHUB_SCOPE:read:user,user:email}
  auth:
    # Who may sign in. Leave both empty only on an instance whose accounts are
    # already the intended audience — otherwise every account the provider
    # authenticates (on gitlab.com: anyone) can read and write flows.
    allowed-usernames: ${AUTH_ALLOWED_USERNAMES:}
    allowed-email-domains: ${AUTH_ALLOWED_EMAIL_DOMAINS:}
  git:
    remote-url: ${GIT_REMOTE_URL:}
    main-repo-path: ${GIT_MAIN_REPO_PATH:/tmp/app/flows-repo/main}
    workspaces-path: ${GIT_WORKSPACES_PATH:/tmp/app/flows-repo/workspaces}
    default-branch: ${GIT_DEFAULT_BRANCH:main}
    # Push and pull as the signed-in user instead of the service account below.
    # Needs an OAuth2 scope that grants repository write access (GitLab:
    # write_repository, GitHub: repo) and a remote hosted by the login provider.
    use-user-credentials: ${GIT_USE_USER_CREDENTIALS:false}
    credentials:
      username: ${GIT_USERNAME:}
      password: ${GIT_TOKEN:}
      ssh-key-path: ${GIT_SSH_KEY_PATH:}
    main-repo-refresh-interval: PT5M
    cleanup:
      max-idle-time: PT24H
      check-interval: PT30M
      enabled: true
