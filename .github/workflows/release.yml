name: Release

# Tagging is the trigger: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and attach the JAR
  packages: write   # push the image to GHCR

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The tests run here too: a tag is not a reason to publish something unverified
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Read the version
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the POM version
        run: |
          pom="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$pom" != "${{ steps.version.outputs.number }}" ]; then
            echo "Tag ${{ steps.version.outputs.tag }} does not match the POM version $pom" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub Actions cache backend needs the container driver; the default
      # docker driver cannot export a cache
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/flow-designer-${{ steps.version.outputs.number }}.jar
